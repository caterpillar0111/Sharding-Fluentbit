apiVersion: v1
kind: ConfigMap
metadata:
  name: fluentbit-config
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush                     5
        Daemon                    Off
        Log_Level                 info
        Parsers_File              parsers-custom.conf
        storage.path              /tmp/flb-storage/
        storage.sync              normal
        storage.backlog.mem_limit 50M
        HTTP_Server               On
        HTTP_Listen               0.0.0.0
        HTTP_Port                 2020

    [INPUT]
        Name              tail
        Path              /var/log/app/*.log
        Parser            nlog_plain
        Tag               app.${TOOL_ID}
        Refresh_Interval  5
        Mem_Buf_Limit     10MB
        storage.type      filesystem
        Skip_Long_Lines   On
        DB                /tmp/fluentbit-pos.db

    # Step 1: attach toolid field
    [FILTER]
        Name   record_modifier
        Match  app.*
        Record toolid ${TOOL_ID}

    # Step 2: Lua 依 toolid 的 FNV-32a hash 計算 shard_id
    #         路由規則定義在 shard.lua，scale-up 時改 SHARD_MAP + apply configmap
    [FILTER]
        Name    lua
        Match   app.*
        script  /fluent-bit/etc/shard.lua
        call    compute_shard

    # Step 3: rewrite tag to shard.0 / shard.1 / shard.2 based on shard_id field
    #         keep=false drops the original app.* record
    [FILTER]
        Name          rewrite_tag
        Match         app.*
        Rule          $shard_id ^(0)$ shard.0 false
        Rule          $shard_id ^(1)$ shard.1 false
        Rule          $shard_id ^(2)$ shard.2 false
        Emitter_Name  shard_router

    [OUTPUT]
        Name          forward
        Match         shard.0
        Host          vector-0.ea-tapinfra.svc.cluster.local
        Port          24224
        Retry_Limit   False

    [OUTPUT]
        Name          forward
        Match         shard.1
        Host          vector-1.ea-tapinfra.svc.cluster.local
        Port          24224
        Retry_Limit   False

    [OUTPUT]
        Name          forward
        Match         shard.2
        Host          vector-2.ea-tapinfra.svc.cluster.local
        Port          24224
        Retry_Limit   False

  # ── Shard 路由規則 ───────────────────────────────────────────────────────────
  #
  # scale-up 操作說明：
  #   1. 修改 SHARD_MAP（新增 shard entry 或重新均分 slot）
  #   2. kubectl apply -f fluentbit-config/configmap.yaml
  #   3. 同步更新 helm/vector/values.yaml 的 shardMap，helm upgrade
  #   （舊日期 log 若因此分散在不同 shard，aggregator 查詢時會自動 merge）
  #
  shard.lua: |
    -- SHARD_MAP：slot (0~255) → shard 對應表
    -- scale-up 時直接修改此表並 apply configmap
    local SHARD_MAP = {
        {from=0,   to=127, shard="0"},
        {from=128, to=255, shard="1"},
    }

    local function fnv32a(s)
        local h = 2166136261
        for i = 1, #s do
            h = bit.bxor(h, string.byte(s, i))
            h = bit.tobit(h * 16777619)
        end
        return h
    end

    function compute_shard(tag, ts, record)
        local slot = math.abs(fnv32a(record["toolid"] or "")) % 256
        for _, e in ipairs(SHARD_MAP) do
            if slot >= e.from and slot <= e.to then
                record["shard_id"] = e.shard
                record["slot"]     = slot
                return 1, ts, record
            end
        end
        record["shard_id"] = "0"
        record["slot"]     = slot
        return 1, ts, record
    end

  parsers-custom.conf: |
    [PARSER]
        Name    nlog_plain
        Format  regex
        Regex   ^(?<log>.+)$
