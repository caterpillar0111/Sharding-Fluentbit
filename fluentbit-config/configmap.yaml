apiVersion: v1
kind: ConfigMap
metadata:
  name: fluentbit-config
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         5
        Daemon        Off
        Log_Level     info
        Parsers_File  parsers-custom.conf

    [INPUT]
        Name              tail
        Path              /var/log/app/*.log
        Parser            nlog_plain
        Tag               app.${TOOL_ID}
        Refresh_Interval  5
        Mem_Buf_Limit     10MB
        Skip_Long_Lines   On
        DB                /tmp/fluentbit-pos.db

    # Step 1: attach toolid field
    [FILTER]
        Name   record_modifier
        Match  app.*
        Record toolid ${TOOL_ID}

    # Step 2: Lua computes slot (fnv32a % 256) and writes shard_id field
    #
    # 分片邏輯說明：
    #   1. 對 toolid 做 FNV-32a hash，結果 mod 256 得到 slot (0~255)
    #   2. 查 SHARD_MAP 決定 slot 對應哪個 vector shard
    #
    # 擴充 shard 時只需修改 SHARD_MAP，規則：
    #   - slot 總數永遠是 256，不變
    #   - 現有的 slot 範圍不能改（否則已在線機台會被重新分配）
    #   - 只能從現有 shard 的尾端切出範圍給新 shard
    #
    # 範例：從 2 個 shard 擴充到 3 個
    #   原本：{from=0,to=127,shard="0"}, {from=128,to=255,shard="1"}
    #   擴充：{from=0,to=127,shard="0"}, {from=128,to=191,shard="1"}, {from=192,to=255,shard="2"}
    [FILTER]
        Name    lua
        Match   app.*
        call    compute_shard
        code    local function fnv32a(s) local h=2166136261 for i=1,#s do h=bit.bxor(h,string.byte(s,i)) h=bit.tobit(h*16777619) end return h end local SHARD_MAP={{from=0,to=127,shard="0"},{from=128,to=255,shard="1"}} function compute_shard(tag,ts,record) local slot=math.abs(fnv32a(record["toolid"] or ""))%256 for _,e in ipairs(SHARD_MAP) do if slot>=e.from and slot<=e.to then record["shard_id"]=e.shard record["slot"]=slot return 1,ts,record end end record["shard_id"]="0" record["slot"]=slot return 1,ts,record end

    # Step 3: rewrite tag to shard.0 / shard.1 based on shard_id field
    #         keep=false drops the original app.* record
    [FILTER]
        Name          rewrite_tag
        Match         app.*
        Rule          $shard_id ^(0)$ shard.0 false
        Rule          $shard_id ^(1)$ shard.1 false
        Emitter_Name  shard_router

    [OUTPUT]
        Name          forward
        Match         shard.0
        Host          vector-0
        Port          24224
        Retry_Limit   5

    [OUTPUT]
        Name          forward
        Match         shard.1
        Host          vector-1
        Port          24224
        Retry_Limit   5

  parsers-custom.conf: |
    [PARSER]
        Name    nlog_plain
        Format  regex
        Regex   ^(?<log>.+)$

