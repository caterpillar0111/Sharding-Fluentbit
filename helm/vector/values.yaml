# 部署目標 namespace（通常是 ea-tapinfra 或 ea-eatooling）
namespace: ea-tapinfra

# Shard 數量 = StatefulSet replicas
# 每個 shard 自動產生：一個 Pod、一個 PVC、一個 Service
# 擴充時只增加數字，現有 shard 不受影響
shards: 2

# SHARD_MAP：log-reader 使用的路由表（與 fluentbit-config/shard.lua 最新版本保持一致）
#
# scale-up 流程（以 2→3 shards 為例）：
#   1. shards: 3
#   2. 在此加入新 shard entry（保留既有 from/to 不變，或採用均分）
#   3. helm upgrade → log-reader 取得新 SHARD_MAP
#   4. 同步更新 fluentbit-config/shard.lua 的 SHARD_MAP_VERSIONS
#
# 目前（2 shards）：
shardMap:
  - {from: 0,   to: 127, shard: "0"}
  - {from: 128, to: 255, shard: "1"}
#
# 擴充至 3 shards（2026-04-01 生效）時改為：
# shardMap:
#   - {from: 0,   to: 84,  shard: "0"}
#   - {from: 85,  to: 170, shard: "1"}
#   - {from: 171, to: 255, shard: "2"}

image:
  repository: timberio/vector
  tag: 0.41.X-debian

storage:
  # 留空使用 cluster 預設 StorageClass
  storageClassName: ""
  size: 10Gi

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# NetworkPolicy：限定哪些 namespace 可以連到 Vector
networkPolicy:
  enabled: true
  allowedNamespaceLabel:
    key: vector-access
    value: "true"
